# docker-compose.yml - starts the WHOLE stack with one command:   docker compose up --build
#
#   browser ──► client (nginx :80)  ──/api──►  server (Express :5000) ──► mongo (:27017)
#                                                        └──────────────► detection (Flask :5001)
#
# Only the web UI (and, optionally, the API) are published to your machine. MongoDB and the
# detection service are reachable only inside the compose network.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db          # named volume => data survives `docker compose down` (use `down -v` to wipe it)
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  detection:
    build: ./detection-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/upi_fraud   # "mongo" = the service name above (Docker DNS)
      DETECTION_URL: http://detection:5001
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
      NODE_ENV: production
    depends_on:                       # start only after the dependencies report healthy
      mongo: { condition: service_healthy }
      detection: { condition: service_healthy }
    ports:
      - "${API_PORT:-5000}:5000"

  client:
    build: ./client
    restart: unless-stopped
    depends_on: [server]
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  mongo-data:
