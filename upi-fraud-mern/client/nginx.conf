# nginx config used by the client Docker image (production).
# 1) serves the static React build,  2) forwards /api/* to the Express container.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Allow CSV uploads up to the API limit (default nginx limit is only 1 MB)
  client_max_body_size 60m;

  # API calls -> Express (the hostname "server" is the docker-compose service name)
  location /api/ {
    proxy_pass http://server:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 900s;   # one million transactions can take a couple of minutes
  }

  # Single-page app: every other URL serves index.html so client-side routing works
  location / {
    try_files $uri /index.html;
  }
}
